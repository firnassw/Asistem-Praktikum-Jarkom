<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="14" y="14" width="216" height="216" rx="48" />
    </clipPath>
  </defs>

  <!-- Offset shadow -->
  <rect x="26" y="26" width="216" height="216" rx="48" fill="#1F1E22" />

  <!-- Partitioned subnet blocks inside squircle -->
  <g clip-path="url(#squircle-clip)">
    <!-- Subnet /25 (Half: Yellow) -->
    <rect x="14" y="14" width="108" height="216" fill="#FCE76C" />
    <!-- Subnet /26 (Quarter: Sky Blue) -->
    <rect x="122" y="14" width="108" height="108" fill="#8BD0FC" />
    <!-- Subnet /27 (Eighth: Coral/Orange) -->
    <rect x="122" y="122" width="54" height="108" fill="#FF8F5C" />
    <!-- Subnet /27 (Eighth: White) -->
    <rect x="176" y="122" width="54" height="108" fill="#FFFFFF" />

    <!-- Dividing lines -->
    <line x1="122" y1="14" x2="122" y2="230" stroke="#1F1E22" stroke-width="14" stroke-linecap="square" />
    <line x1="122" y1="122" x2="230" y2="122" stroke="#1F1E22" stroke-width="14" stroke-linecap="square" />
    <line x1="176" y1="122" x2="176" y2="230" stroke="#1F1E22" stroke-width="14" stroke-linecap="square" />
  </g>

  <!-- Outer border -->
  <rect x="14" y="14" width="216" height="216" rx="48" fill="none" stroke="#1F1E22" stroke-width="14" />
</svg>